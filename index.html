<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗地主输赢计分</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;color:#17202a;margin:0;padding:18px}main{max-width:620px;margin:auto}h1{font-size:24px}section{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0000000b}label{display:block;font-weight:600;margin:9px 0 5px}input,select,button{font:inherit;box-sizing:border-box;min-height:44px;border-radius:9px}input,select{border:1px solid #ccd2da;padding:9px;width:100%;background:white}button{border:0;padding:10px 14px;background:#176b4c;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e8edf1;color:#253341}button.danger{background:#a83b3b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.score{text-align:center;padding:12px 5px;background:#f2f7f4;border-radius:10px}.score b{font-size:24px;display:block;overflow-wrap:anywhere}.positive{color:#087343}.negative{color:#ba3333}.muted{color:#647080;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.history{padding:9px 0;border-bottom:1px solid #e7ebee;font-size:14px}.history:last-child{border:0}.help{font-size:13px;color:#55616c;line-height:1.6}</style></head><body><main><h1>🃏 斗地主输赢计分器</h1><p class="muted">三人计分 · 手动输入分数 · 自动累计 · 本机保存</p><section><h2>玩家与累计总分</h2><div class="grid" id="players"></div><p class="muted">总分始终为 0（输赢相抵）</p></section><section><h2>记录本局</h2><label for="mode">计分方式</label><select id="mode"><option value="winner">本局赢家</option><option value="loser">本局输家</option></select><label for="winner" id="playerLabel">本局赢家</label><select id="winner"></select><label for="points" id="pointsLabel">每位输家输多少分</label><input id="points" type="text" inputmode="text" autocomplete="off" value="3"><p class="help" id="modeHelp">例如输入 3：赢家 +6，另外两人各 −3。也可以选择“自定义三人分数”分别填写。</p><label><input type="checkbox" id="custom" style="width:auto;min-height:auto"> 自定义三人分数</label><div id="customInputs" style="display:none"></div><p id="preview" aria-live="polite"></p><button id="add" style="width:100%">保存本局并累计</button><p id="error" class="negative" role="alert"></p></section><section><h2>历史记录 <span id="count" class="muted"></span></h2><div id="history"></div><div class="row" style="margin-top:14px"><button class="secondary" id="undo">撤销上一局</button><button class="secondary" id="export">导出记录 CSV</button><button class="danger" id="reset">全部清空</button></div></section></main><script>const KEY='doudizhu_scores_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.names)||!Array.isArray(state.history))state={names:['我','玩家2','玩家3'],history:[]};const $=id=>document.getElementById(id);const fmt=n=>Number(n.toFixed(8)).toString();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function current(){return [0,1,2].map(i=>state.history.reduce((sum,h)=>sum+h.scores[i],0))}function draw(){const sums=current();$('players').innerHTML=state.names.map((n,i)=>`<div class="score"><input aria-label="玩家${i+1}姓名" data-name="${i}" value="${esc(n)}"><b class="${sums[i]>0?'positive':sums[i]<0?'negative':''}">${sums[i]>0?'+':''}${fmt(sums[i])}</b><small class="muted">累计分数</small></div>`).join('');$('winner').innerHTML=state.names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');$('count').textContent=`共 ${state.history.length} 局`;$('history').innerHTML=state.history.length?state.history.slice().reverse().map((h,j)=>`<div class="history"><strong>第 ${state.history.length-j} 局</strong>　${state.names.map((n,i)=>`${esc(n)} ${h.scores[i]>0?'+':''}${fmt(h.scores[i])}`).join('　')}</div>`).join(''):'暂无记录';$('customInputs').innerHTML=state.names.map((n,i)=>`<label>${esc(n)}的分数（赢填正数，输填负数）<input data-score="${i}" type="number" step="any" inputmode="decimal" value="0"></label>`).join('');preview()}function preview(){const loser=$('mode').value==='loser';$('playerLabel').textContent=loser?'本局输家':'本局赢家';$('pointsLabel').textContent=loser?'本局输家输多少分（填负数）':'每位输家输多少分（可填负数）';$('modeHelp').textContent=loser?'例如输入 -6：本局输家 -6，其他两人各 +3。':'例如输入 3：赢家 +6，另外两人各 -3。输入 -3 则反向计分。';if($('custom').checked){$('preview').textContent='请填写三人分数，三人相加必须等于 0。';return}const raw=$('points').value.trim(),p=Number(raw),w=Number($('winner').value);if(!raw||!Number.isFinite(p)||p===0||Math.abs(p)>1e9){$('preview').textContent='请输入有效的非零分数';return}const scores=[0,1,2].map(i=>loser?(i===w?p:-p/2):(i===w?2*p:-p));$('preview').textContent=state.names.map((n,i)=>`${n} ${scores[i]>0?'+':''}${fmt(scores[i])}`).join(' ｜ ')}$('players').addEventListener('change',e=>{if(e.target.matches('[data-name]')){const i=Number(e.target.dataset.name);state.names[i]=e.target.value.trim().slice(0,30)||`玩家${i+1}`;save();draw()}});$('custom').addEventListener('change',()=>{$('customInputs').style.display=$('custom').checked?'block':'none';preview()});$('points').addEventListener('input',preview);$('mode').addEventListener('change',()=>{$('points').value=$('mode').value==='loser'?'-6':'3';preview()});$('winner').addEventListener('change',preview);$('add').addEventListener('click',()=>{let scores;if($('custom').checked){scores=[...document.querySelectorAll('[data-score]')].map(el=>el.value.trim()===''?NaN:Number(el.value));if(scores.some(v=>!Number.isFinite(v)||Math.abs(v)>1e9)||Math.abs(scores.reduce((a,b)=>a+b,0))>1e-7||scores.every(v=>v===0)){$('error').textContent='请填写有效分数，且三人分数之和必须为 0。';return}}else{const p=Number($('points').value),w=Number($('winner').value);if($('points').value.trim()===''||!Number.isFinite(p)||p===0||Math.abs(p)>1e9){$('error').textContent='请输入有效的非零分数（支持负数）。';return}scores=[0,1,2].map(i=>$('mode').value==='loser'?(i===w?p:-p/2):(i===w?2*p:-p))}state.history.push({scores,date:new Date().toISOString()});$('error').textContent='';save();draw();$('customInputs').style.display=$('custom').checked?'block':'none'});$('undo').addEventListener('click',()=>{if(!state.history.length)return;if(confirm('撤销最近一局？')){state.history.pop();save();draw()}});$('reset').addEventListener('click',()=>{if(confirm('确定清空全部局数和累计分数吗？')){state.history=[];save();draw()}});$('export').addEventListener('click',()=>{const rows=[['局数',...state.names],...state.history.map((h,i)=>[i+1,...h.scores])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='斗地主计分记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});draw();</script></body></html>
